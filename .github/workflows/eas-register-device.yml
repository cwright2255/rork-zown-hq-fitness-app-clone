name: Register Apple Device
on:
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: expo
        run: npm install --legacy-peer-deps
      - name: Create device registration
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "=========================================="
          echo "DEVICE REGISTRATION"
          echo "=========================================="
          npx eas-cli@latest device:create --apple-team-id GLFKG8342N 2>&1 | tee /tmp/device-output.txt || true
          echo "=========================================="
          echo "If a URL appeared above, open it on your iPhone in Safari"
          echo "=========================================="
          cat /tmp/device-output.txt
