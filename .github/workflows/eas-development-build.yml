name: EAS Development Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: expo
        run: npm install

      - name: Fix dependency versions
        working-directory: expo
        run: npx expo install --fix

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add expo/package-lock.json expo/package.json
          git diff --cached --quiet || git commit -m "chore: fix dependency versions via expo install --fix"
          git push

      - name: Run EAS Build
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --profile development --platform all --non-interactive