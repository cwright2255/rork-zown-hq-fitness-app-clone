name: EAS Development Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Trigger EAS development build for iOS and Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Expo + EAS CLIs
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${ { secrets.EXPO_TOKEN } }

      - name: Install JS dependencies
        run: npm install

      - name: Trigger EAS Build
        run: npx eas-cli build --profile development --platform all --non-interactive
