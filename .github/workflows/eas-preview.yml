name: EAS Update Preview

on:
  push:
    branches:
      - feat/fitleus-light-theme-codemod
      - feat/fitleus-light-theme-infra
      - feat/fitleus-light-theme-codemod-v2
  pull_request:
    branches:
      - main
      - feat/fitleus-light-theme
      - feat/fitleus-light-theme-infra

concurrency:
  group: eas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish JS preview to Expo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Expo + EAS CLIs
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install JS dependencies
        run: bun install

      - name: Resolve EAS branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            REF="${{ github.ref_name }}"
            SAFE="$REF//\//-}"
            echo "name=$SAFE" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve update message
        id: message
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
