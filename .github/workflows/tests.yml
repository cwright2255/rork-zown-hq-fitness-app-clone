name: Tests

# Runs the whole jest suite on every push to main and on every pull request, so a change that breaks something shows up
# as a red mark on the commit instead of on someone's phone. It needs no secrets.
#
# The suite stands in for Firebase and the phone's own features, so a green run does not replace the phone checks in
# expo/docs/DEVICE_CHECKS.md.
#
# workflow_call lets another workflow run these tests first. To make "Expo Publish" wait for them, give it a job
# `tests: { uses: ./.github/workflows/tests.yml }` and put `needs: tests` on its publish job.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is what pins the versions, so install exactly what it says.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the tests
        run: npx jest --ci --maxWorkers=2
