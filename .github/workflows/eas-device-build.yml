name: EAS Device Build (Physical iPhone)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: expo
        run: npm install --legacy-peer-deps
      - name: Build for device
        working-directory: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --profile development-device --platform ios --non-interactive
